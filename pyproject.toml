[tool.poetry]
name = "nomad-gunstore-backend"
version = "0.1.0"
description = "Backend project for the \"Palmetto State Armory\" weapons store website, developed as part of a thesis at Nomad College."
authors = ["ExtroEd"]
license = "MIT"
readme = "README.md"
packages = [{include = "apps"}]

[tool.poetry.dependencies]
python = ">=3.12,<4"
django = "^5.1.6"
djangorestframework = "^3.15.2"
psycopg2-binary = "^2.9.10"
celery = {extras = ["redis"], version = "^5.5.2"}
redis = "^5.2.1"
drf-spectacular = {extras = ["sidecar"], version = "^0.28.0"}
gunicorn = "^23.0.0"
openpyxl = "^3.1.5"
ruff = "^0.9.9"
drf-spectacular-sidecar = "^2025.3.1"
djangorestframework-simplejwt = "^5.5.0"
python-dotenv = "^1.1.0"
drf-yasg = "^1.21.10"
psycopg = {extras = ["binary"], version = "^3.2.6"}
pillow = "^11.2.1"
django-filter = "^25.1"
django-ckeditor-5 = "^0.2.17"
python-decouple = "^3.8"
django-environ = "^0.12.0"
cloudinary = "^1.44.0"
poetry-core = ">=2.0.0,<3.0.0"
django-cors-headers = "^4.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
